<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>جدول الحصص</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;font-family:Arial,"Tahoma",sans-serif;color:#111}body{min-height:100vh}.page{width:100%;max-width:1600px;margin:auto;padding:10px}.title{text-align:center;font-weight:800;color:#0d2d70;font-size:clamp(24px,3.2vw,52px);line-height:1.15;margin:8px 0 18px}.subtitle{text-align:center;color:#183b78;font-size:clamp(14px,1.5vw,24px);font-weight:700;margin-top:-10px;margin-bottom:18px}.table-wrap{width:100%;overflow:hidden;border:1px solid #9aa7bc;border-radius:14px}.schedule{display:grid;grid-template-columns:1.05fr repeat(8,minmax(0,1fr));min-width:760px}.cell{min-height:92px;border:1px solid #fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:clamp(13px,1.45vw,25px);line-height:1.35}.head{min-height:90px;color:#fff;font-size:clamp(15px,1.55vw,27px);font-weight:800}.time{background:#173b82;color:#fff}.h1{background:#7a28a7}.h2{background:#419b43}.h3{background:#12a6aa}.h4{background:#f05d12}.h5{background:#1670c8}.h6{background:#f2a700}.h7{background:#3a9d3d}.cell.day-sun{background:#b88718!important;color:#111!important;font-weight:800}.cell.day-mon{background:#4d7fbd!important;color:#fff!important;font-weight:800}.cell.day-tue{background:#4d8439!important;color:#fff!important;font-weight:800}.cell.day-wed{background:#76539f!important;color:#fff!important;font-weight:800}.cell.day-thu{background:#ae4e79!important;color:#fff!important;font-weight:800}.sun{background:#fff0c8}.mon{background:#cfe0fa}.tue{background:#dff0d0}.wed{background:#dfd0f1}.thu{background:#f6cddd}.break{background:#ffe1e7;color:#a00000;font-weight:800}.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:14px}.legend span{padding:5px 10px;border-radius:8px;font-weight:700}.grade4{background:#f7a15a}.grade5{background:#8bc3f2}.grade6{background:#9bd58b}.grade7{background:#c6a7e9}.grade8{background:#f29cc1}.grade9{background:#f4c46b}.note{text-align:center;color:#555;font-size:12px;margin-top:10px}@media(max-width:700px){.page{padding:4px}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.schedule{min-width:820px;width:820px;grid-template-columns:.82fr repeat(8,1fr)}.cell{min-height:78px;font-size:14px;padding:5px}.head{min-height:78px;font-size:15px;padding:5px}.head small{font-size:.78em}.title{font-size:27px;margin-bottom:6px}.subtitle{font-size:13px;margin-bottom:8px}.legend{gap:6px}.legend span{padding:5px 8px}.note{font-size:11px}}</style></head><body><div class="page"><h1 class="title">مجمع اللهابة التعليمي</h1><div class="subtitle" id="teacher">سعود الشريف</div><div class="table-wrap"><div class="schedule" id="schedule"></div></div><div class="legend"><span class="grade4">رابع</span><span class="grade5">خامس</span><span class="grade6">سادس</span><span class="grade7">أول متوسط</span><span class="grade8">ثاني متوسط</span><span class="grade9">ثالث متوسط / ثانوي</span></div><div class="note">الصفحة متجاوبة وتعمل على الجوال والآيباد والكمبيوتر.</div></div><script>const saud={name:'سعود الشريف',rows:[['الأحد','أول متوسط<br>رقمية','ثالث ثانوي<br>تقنية','','فسحة','رابع<br>رقمية','ثاني متوسط<br>رقمية','','أول ثانوي<br>تقنية','sun','day-sun'],['الإثنين','سادس<br>رقمية','خامس<br>نشاط','خامس<br>رقمية','فسحة','','ثالث متوسط<br>رقمية','','','mon','day-mon'],['الثلاثاء','خامس<br>رقمية','أول ثانوي<br>تقنية','أول متوسط<br>رقمية','فسحة','','','سادس<br>رقمية','','tue','day-tue'],['الأربعاء','','ثالث ثانوي<br>تقنية','ثاني متوسط<br>رقمية','فسحة','','','','','wed','day-wed'],['الخميس','','خامس<br>نشاط','','فسحة','','أول ثانوي<br>تقنية','رابع<br>رقمية','ثالث متوسط<br>رقمية','thu','day-thu']]};const zyad={name:'زياد عسيري',rows:[['الأحد','رابع<br>علوم','','ثالث ثانوي<br>علم أرض','فسحة','أول متوسط<br>علوم','ثاني ثانوي<br>أحياء','','خامس<br>علوم','sun','day-sun'],['الإثنين','رابع<br>علوم','','أول متوسط<br>علوم','فسحة','','ثالث ثانوي<br>علم أرض','','أول ثانوي<br>أحياء','mon','day-mon'],['الثلاثاء','','ثالث ثانوي<br>علم أرض','رابع<br>علوم','فسحة','خامس<br>علوم','ثاني ثانوي<br>أحياء','','أول متوسط<br>علوم','tue','day-tue'],['الأربعاء','خامس<br>علوم','أول ثانوي<br>أحياء','','فسحة','','ثاني ثانوي<br>أحياء','رابع<br>علوم','','wed','day-wed'],['الخميس','','ثاني ثانوي<br>أحياء','','فسحة','أول ثانوي<br>أحياء','خامس<br>علوم','','أول متوسط<br>علوم','thu','day-thu']]};const periods=[['الحصة الأولى','7:00 - 7:45','h1'],['الحصة الثانية','7:45 - 8:30','h2'],['الحصة الثالثة','8:30 - 9:30','h3'],['فسحة','15 دقيقة','break'],['الحصة الرابعة','9:30 - 10:15','h4'],['الحصة الخامسة','10:15 - 11:00','h5'],['الحصة السادسة','11:00 - 11:45','h6'],['الحصة السابعة','11:45 - 12:30','h7']];function cell(cls,html,head=false){const d=document.createElement('div');d.className='cell '+(head?'head ':'')+cls;d.innerHTML=html||'';return d}function render(data){document.getElementById('teacher').textContent=data.name;const s=document.getElementById('schedule');s.innerHTML='';s.appendChild(cell('time','توقيت<br>الحصص',true));periods.forEach(p=>s.appendChild(cell(p[2],p[0]+'<br><small>'+p[1]+'</small>',true)));data.rows.forEach(r=>{s.appendChild(cell(r[10],r[0]));for(let i=1;i<=8;i++){const cls=i===4?'break':r[9];s.appendChild(cell(cls,r[i]||''));}})}const isZyad=new URLSearchParams(location.search).get('teacher')==='zyad';render(isZyad?zyad:saud);</script></body></html>
