<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة الحجز</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="data.js"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1300px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e0e5ee;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{font-size:27px;font-weight:900}.muted{font-size:12px;color:#667085}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#a15c00}.bad{background:#fef3f2;color:#b42318}.alert{padding:10px;border-radius:9px;margin:8px 0}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #dfe5ee;padding:7px;text-align:center}th{background:#eef3f8}</style></head><body><div class="wrap"><div class="card"><h1>لوحة إدارة حجز الجداول</h1><p class="muted">هذه اللوحة تعطي نظرة سريعة على اكتمال حجز النصاب. الربط المشترك عبر Supabase يضاف بعد وضع config.js وتشغيل schema.sql.</p></div><div id="stats" class="grid"></div><div class="card"><h2>حالة المعلمين</h2><table><thead><tr><th>المعلم</th><th>المطلوب</th><th>المحجوز</th><th>المتبقي</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const LS='school-booking-v1';const local=(()=>{try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return {}}})();const data=SCHOOL_DATA.teachers;const by=Object.values(local);const rows=Object.entries(data).map(([name,t])=>{const n=by.filter(x=>x.teacher===name).length;return {name,required:t.required,booked:n,remaining:Math.max(0,t.required-n)}});document.getElementById('stats').innerHTML=`<div class="card"><div class="stat">${rows.length}</div><div class="muted">المعلمون</div></div><div class="card"><div class="stat">${rows.reduce((a,x)=>a+x.required,0)}</div><div class="muted">إجمالي الحصص المطلوبة</div></div><div class="card"><div class="stat">${rows.reduce((a,x)=>a+x.booked,0)}</div><div class="muted">إجمالي المحجوز محليًا</div></div><div class="card"><div class="stat">${rows.filter(x=>x.remaining===0).length}</div><div class="muted">معلمون مكتملون</div></div>`;document.getElementById('rows').innerHTML=rows.map(x=>`<tr><td>${x.name}</td><td>${x.required}</td><td>${x.booked}</td><td>${x.remaining}</td><td>${x.remaining===0?'<span class="alert ok">مكتمل</span>':'<span class="alert warn">ناقص</span>'}</td></tr>`).join('');</script></body></html>
