<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حجز الجدول - اختيار المعلم</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#17365d;color:#fff;border-radius:18px;padding:28px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{background:#fff;border:1px solid #e0e5ee;border-radius:14px;padding:16px;box-shadow:0 3px 14px #00000008}.btn{display:block;text-decoration:none;background:#2563eb;color:#fff;padding:11px 13px;border-radius:9px;text-align:center;font-weight:700;margin-top:10px}.muted{color:#667085;font-size:13px}.pill{display:inline-block;background:#edf2ff;color:#2444a3;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}</style></head><body><div class="wrap"><div class="hero"><h1>نظام حجز الجداول المدرسية</h1><p>كل معلم يدخل صفحته ويختار حصصه، والنظام يمنع التعارض ويحسب النصاب المطلوب.</p></div><div class="card"><h2>اختر اسم المعلم</h2><div id="teachers" class="grid"></div></div></div><script>const teachers=["قرناس المطيري","طلال الحربي","احمد منصور","أسامة المفرج","دبيان الفعيم","سطام","محمد حجاب","عبدالله السيف","سند صويان","فهد صنيتان","صلاح المطيري","هابس","سعود الشريف","معلم فيزياء","عبدالهادي المري","زياد عسيري"];document.getElementById('teachers').innerHTML=teachers.map(t=>`<div class="card"><b>${t}</b><span class="pill">صفحة المعلم</span><a class="btn" href="teacher.html?teacher=${encodeURIComponent(t)}">دخول</a></div>`).join('');</script></body></html>
