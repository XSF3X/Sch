<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حجز الجداول</title><style>body{font-family:Tahoma,Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{background:#17365d;color:#fff;padding:24px;border-radius:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:13px;padding:15px}.btn{display:block;background:#2563eb;color:#fff;text-decoration:none;text-align:center;padding:10px;border-radius:8px;margin-top:10px}.muted{color:#667085;font-size:12px}.pill{display:inline-block;background:#edf2ff;color:#2444a3;padding:4px 8px;border-radius:999px;font-size:11px}</style></head><body><div class="wrap"><div class="hero"><h1>نظام حجز جداول المعلمين</h1><p>اختر اسمك للدخول إلى صفحة الحجز.</p></div><div id="teachers" class="grid"></div></div><script src="data.js"></script><script>document.getElementById('teachers').innerHTML=Object.entries(SCHOOL_DATA.teachers).map(([name,t])=>`<div class="card"><h3>${name}</h3><span class="pill">المطلوب ${t.required} حصة</span><a class="btn" href="teacher.html?teacher=${encodeURIComponent(name)}">دخول المعلم</a></div>`).join('');</script></body></html>
